name: Zeeb heartbeat

# GitHub only starts scheduled jobs about once an hour on free accounts, however often you ask.
# So each run stays alive for about an hour and gives Zeeb a heartbeat every 10 minutes inside it.
# (Set a repository variable HEARTBEAT_MINUTES to change the gap. Shorter uses Gemini's free limit faster.)
# While your PC brain is running, each heartbeat here just checks in and skips.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # save his state back into the repo
  issues: write     # read and answer visitor notes and letters

concurrency:
  group: zeeb-heartbeat
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Heartbeats for the next hour
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
          SHOP_CURRENCY: ${{ vars.SHOP_CURRENCY }}
          GAP: ${{ vars.HEARTBEAT_MINUTES || '10' }}
        run: |
          git config user.name "zeeb-bot"
          git config user.email "zeeb-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 56 * 60 ))
          while :; do
            started=$(date +%s)
            # Start from exactly what's on GitHub (your PC may have saved in the meantime).
            git fetch --quiet origin main && git reset --hard --quiet origin/main
            node brain/tick.js || echo "This heartbeat had a problem; trying again next time."
            git add data
            if ! git diff --cached --quiet; then
              git commit -m "zeeb: heartbeat" --quiet
              if git pull --rebase --quiet; then
                git push --quiet || echo "Couldn't save this heartbeat."
              else
                git rebase --abort 2>/dev/null || true
                echo "Your PC saved a heartbeat at the same time, so this one was skipped."
              fi
            fi
            next=$(( started + GAP * 60 ))
            if [ "$next" -ge "$end" ]; then break; fi
            sleep $(( next - $(date +%s) > 0 ? next - $(date +%s) : 0 ))
          done
