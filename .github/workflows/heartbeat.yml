name: Zeeb heartbeat

# Wakes Zeeb up every few minutes so he can decide what to do next.
# Every 10 minutes keeps him inside Gemini's free daily limit. GitHub often runs it a little late. That's fine.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # save his state back into the repo
  issues: write     # read and answer visitor notes

concurrency:
  group: zeeb-heartbeat
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: One heartbeat
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node brain/tick.js
      - name: Save his state
        run: |
          git config user.name "zeeb-bot"
          git config user.email "zeeb-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "zeeb: heartbeat" --quiet
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && exit 0; sleep 5; done
          exit 1
